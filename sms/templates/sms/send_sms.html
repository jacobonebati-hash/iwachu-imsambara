<!DOCTYPE html>

<html lang="sw">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Send SMS - IWACHU IMSAMBARA
    </title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<div class="container py-5">


    <div class="row justify-content-center">

        <div class="col-lg-9">


            <div class="card shadow">


                <!-- HEADER -->

                <div class="card-header bg-primary text-white">

                    <h3 class="mb-0">

                        📱 IWACHU SMS SYSTEM

                    </h3>

                </div>


                <div class="card-body">


                    <!-- SYSTEM MESSAGES -->

                    {% if messages %}

                        {% for message in messages %}

                            <div
                                class="alert alert-{{ message.tags }}"
                            >

                                {{ message }}

                            </div>

                        {% endfor %}

                    {% endif %}



                    <form
                        method="POST"
                        id="smsForm"
                    >

                        {% csrf_token %}



                        <!-- MEMBERS -->

                        <div class="mb-4">


                            <div
                                class="d-flex justify-content-between align-items-center mb-2"
                            >

                                <label
                                    class="form-label fw-bold mb-0"
                                >

                                    👥 Chagua Wanachama

                                </label>


                                <button
                                    type="button"
                                    class="btn btn-sm btn-outline-primary"
                                    id="selectAllBtn"
                                >

                                    ☑️ Chagua Wote

                                </button>

                            </div>



                            <div
                                class="border rounded p-3 bg-white"
                                style="max-height: 350px; overflow-y: auto;"
                            >


                                {% for member in members %}


                                    <div
                                        class="form-check border-bottom py-2"
                                    >

                                        <input
                                            class="form-check-input member-checkbox"
                                            type="checkbox"
                                            name="member_ids"
                                            value="{{ member.id }}"
                                            id="member{{ member.id }}"
                                        >


                                        <label
                                            class="form-check-label w-100"
                                            for="member{{ member.id }}"
                                        >

                                            <strong>

                                                {{ member.jina }}

                                            </strong>

                                            <br>

                                            <small class="text-muted">

                                                📱 {{ member.simu }}

                                            </small>

                                        </label>

                                    </div>


                                {% empty %}


                                    <div class="alert alert-warning">

                                        Hakuna wanachama
                                        waliopo.

                                    </div>


                                {% endfor %}


                            </div>


                            <!-- COUNT -->

                            <div
                                class="mt-2"
                            >

                                <span
                                    class="badge bg-secondary"
                                    id="selectedCount"
                                >

                                    0 wamechaguliwa

                                </span>

                            </div>


                        </div>



                        <!-- MESSAGE -->

                        <div class="mb-4">


                            <label
                                class="form-label fw-bold"
                            >

                                💬 Ujumbe

                            </label>


                            <textarea
                                name="message"
                                id="message"
                                class="form-control"
                                rows="6"
                                maxlength="1000"
                                placeholder="Andika ujumbe wako hapa..."
                                required
                            ></textarea>


                            <div
                                class="d-flex justify-content-between mt-1"
                            >

                                <small class="text-muted">

                                    Ujumbe wa IWACHU

                                </small>


                                <small
                                    class="text-muted"
                                    id="characterCount"
                                >

                                    0 / 1000

                                </small>

                            </div>


                        </div>



                        <!-- SEND -->

                        <button
                            type="submit"
                            class="btn btn-primary btn-lg w-100"
                            id="sendButton"
                        >

                            📱 TUMA SMS

                        </button>


                    </form>


                    <hr class="my-4">


                    <!-- HISTORY BUTTON -->

                    <a
                        href="{% url 'sms_history' %}"
                        class="btn btn-outline-dark w-100"
                    >

                        📊 Angalia SMS History

                    </a>


                </div>

            </div>

        </div>

    </div>

</div>



<script>


// ======================================================
// SELECT ALL
// ======================================================

const selectAllBtn =
    document.getElementById("selectAllBtn");


const checkboxes =
    document.querySelectorAll(
        ".member-checkbox"
    );


const selectedCount =
    document.getElementById(
        "selectedCount"
    );


function updateCount() {

    const selected =
        document.querySelectorAll(
            ".member-checkbox:checked"
        ).length;


    selectedCount.textContent =
        selected + " wamechaguliwa";


    if (
        selected === checkboxes.length
        &&
        checkboxes.length > 0
    ) {

        selectAllBtn.innerHTML =
            "❌ Ondoa Wote";

    } else {

        selectAllBtn.innerHTML =
            "☑️ Chagua Wote";

    }

}


selectAllBtn.addEventListener(
    "click",
    function () {


        const allSelected =
            document.querySelectorAll(
                ".member-checkbox:checked"
            ).length === checkboxes.length;


        checkboxes.forEach(
            function (checkbox) {

                checkbox.checked =
                    !allSelected;

            }
        );


        updateCount();

    }
);



checkboxes.forEach(
    function (checkbox) {

        checkbox.addEventListener(
            "change",
            updateCount
        );

    }
);



// ======================================================
// CHARACTER COUNT
// ======================================================

const message =
    document.getElementById(
        "message"
    );


const characterCount =
    document.getElementById(
        "characterCount"
    );


message.addEventListener(
    "input",
    function () {

        characterCount.textContent =
            this.value.length + " / 1000";

    }
);



// ======================================================
// CONFIRM BEFORE SEND
// ======================================================

document
    .getElementById("smsForm")
    .addEventListener(
        "submit",
        function (event) {


            const selected =
                document.querySelectorAll(
                    ".member-checkbox:checked"
                ).length;


            if (selected === 0) {

                event.preventDefault();

                alert(
                    "Tafadhali chagua angalau mwanachama mmoja."
                );

                return;

            }


            const confirmed =
                confirm(
                    "Unataka kutuma SMS kwa "
                    + selected
                    + " wanachama?"
                );


            if (!confirmed) {

                event.preventDefault();

            }

        }
    );


// ======================================================
// INITIAL COUNT
// ======================================================

updateCount();


</script>


</body>

</html>
