<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Member</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Register New Member</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Jina</label>

                    <input
                        type="text"
                        name="jina"
                        class="form-control"
                        placeholder="Ingiza jina"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Simu</label>

                    <input
                        type="text"
                        name="simu"
                        class="form-control"
                        placeholder="Mfano: 0712345678"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Kitongoji</label>

                    <input
                        type="text"
                        name="kitongoji"
                        class="form-control"
                        placeholder="Ingiza kitongoji"
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Jinsia</label>

                    <select name="jinsia" class="form-select" required>

                        <option value="">-- Chagua jinsia --</option>

                        <option value="Mwanaume">
                            Mwanaume
                        </option>

                        <option value="Mwanamke">
                            Mwanamke
                        </option>

                    </select>
                </div>

                <button type="submit" class="btn btn-primary">
                    Register Member
                </button>

                <a href="{% url 'members_list' %}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
