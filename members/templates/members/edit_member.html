<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Member</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #555;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Edit Member</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Name</label>
        <input
            type="text"
            name="name"
            value="{{ member.name }}"
            required
        >

        <label>Phone</label>
        <input
            type="text"
            name="phone"
            value="{{ member.phone }}"
            required
        >

        <label>Village</label>
        <input
            type="text"
            name="village"
            value="{{ member.village }}"
        >

        <button type="submit">
            Update Member
        </button>
    </form>

    <a href="{% url 'member_detail' member.id %}" class="back">
        ← Back to Member Details
    </a>

</div>

</body>
</html>
