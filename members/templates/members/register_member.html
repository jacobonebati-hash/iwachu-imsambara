<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register Member - IWACHU IMSAMBARA</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="/">
            IWACHU IMSAMBARA
        </a>

        <a href="/"
           class="btn btn-light btn-sm">
            Dashboard
        </a>

    </div>

</nav>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0">
                        Register Member
                    </h4>

                </div>


                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}


                        <div class="mb-3">

                            <label class="form-label">
                                Jina Kamili
                            </label>

                            {{ form.jina }}

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Namba ya Simu
                            </label>

                            {{ form.simu }}

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Kitongoji
                            </label>

                            {{ form.kitongoji }}

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Jinsia
                            </label>

                            {{ form.jinsia }}

                        </div>


                        <div class="form-check mb-3">

                            {{ form.status }}

                            <label class="form-check-label">
                                Active Member
                            </label>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            SAVE MEMBER

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


</body>

</html>
