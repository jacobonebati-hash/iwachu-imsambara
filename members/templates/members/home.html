<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IWACHU IMSAMBARA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            IWACHU IMSAMBARA
        </a>

        <div>
            <a href="/" class="btn btn-light btn-sm">
                Home
            </a>

           <a href="{% url 'members_list' %}"
   class="btn btn-light btn-sm">

    Members

</a>

            <a href="{% url 'send_sms' %}"
   class="btn btn-light btn-sm">
    Send SMS
</a>
            </a>
        </div>
    </div>
</nav>


<div class="container mt-5">

    <div class="text-center">
        <h1 class="fw-bold">
            IWACHU IMSAMBARA
        </h1>

        <p class="lead">
            Member Information & Communication System
        </p>
    </div>


    <div class="row mt-5">

        <div class="col-md-4 mb-3">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h5>Total Members</h5>
                  <h2>{{ total_members }}</h2>
                </div>
            </div>
        </div>


        <div class="col-md-4 mb-3">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h5>SMS Sent</h5>
                    <h2>{{ total_sms }}</h2>
                </div>
            </div>
        </div>


        <div class="col-md-4 mb-3">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h5>Active Members</h5>
                    <h2>0</h2>
                </div>
            </div>
        </div>

    </div>
<div class="container mt-5">

    <h3 class="mb-4">Quick Actions</h3>

    <div class="row">

        <div class="col-md-4 mb-3">
            <a href="{% url 'register_member' %}"
   class="btn btn-primary w-100 p-3">

    Register Member

</a>
        </div>

        <div class="col-md-4 mb-3">
 <a href="{% url 'send_sms' %}"
   class="btn btn-light btn-sm">
    Send SMS
</a>
  

        </div>

        <div class="col-md-4 mb-3">
      <a href="{% url 'sms_history' %}"
   class="btn btn-light btn-sm">
    SMS History
</a>
        </div>

    </div>

</div>
</div>

</body>
</html>
